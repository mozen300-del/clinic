<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيادة الشفاء - حجز موعد</title>
<style>
body{font-family:Tahoma;background:#f0f8ff;margin:0;padding:20px}
.container{max-width:500px;background:white;margin:auto;padding:25px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h1{color:#0d6efd;text-align:center}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#0d6efd;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer}
button:hover{background:#0b5ed7}
.card{background:#e8f4ff;padding:10px;border-radius:8px;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<h1>🏥 عيادة الشفاء</h1>
<p style="text-align:center;color:gray">نظام حجز المواعيد الإلكتروني</p>

<input id="name" placeholder="اسم المريض">
<input id="phone" placeholder="رقم التلفون">
<select id="doctor">
<option>د. أحمد - باطنية</option>
<option>د. مايا - أسنان</option>
<option>د. سارة - أطفال</option>
</select>
<input id="date" type="date">
<button onclick="book()">تأكيد الحجز</button>

<div id="list"></div>
</div>

<script>
let bookings = JSON.parse(localStorage.getItem('bookings')||'[]');
show();
function book(){
 let b = {
  name: document.getElementById('name').value,
  phone: document.getElementById('phone').value,
  doctor: document.getElementById('doctor').value,
  date: document.getElementById('date').value
 };
 if(!b.name||!b.date){alert('أكمل البيانات');return;}
 bookings.push(b);
 localStorage.setItem('bookings', JSON.stringify(bookings));
 show();
 alert('تم الحجز بنجاح ✅');
}
function show(){
 let html='<h3>المواعيد المحجوزة:</h3>';
 bookings.forEach(x=>{ html+=`<div class="card">👤 ${x.name} | ${x.doctor} | 📅 ${x.date}</div>` });
 document.getElementById('list').innerHTML=html;
}
</script>
</body>
</html>
